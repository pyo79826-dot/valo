<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALO Sens RNG</title>
  <style>
    :root {
      --bg: #08090c;
      --panel: #101218;
      --panel-2: #151820;
      --line: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #9298a7;
      --red: #ff4655;
      --red-2: #b72a36;
      --good: #8fe3c1;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 80% 10%, rgba(255,70,85,.12), transparent 27%),
        linear-gradient(135deg,#07080b 0%,#0b0d12 56%,#10080a 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.08;
      background-image:linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom, black, transparent 75%);
    }
    .wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:42px 0 64px;position:relative}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}
    .logo{width:38px;height:38px;border:2px solid var(--red);transform:skew(-8deg);position:relative}
    .logo:after{content:"";position:absolute;left:8px;top:8px;width:18px;height:18px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 38%,38% 100%,0 100%)}
    .tiny{font-size:12px;color:var(--muted);letter-spacing:.08em}
    .hero{padding:38px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));box-shadow:0 26px 70px rgba(0,0,0,.35);position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;width:260px;height:260px;background:var(--red);right:-165px;top:-165px;transform:rotate(45deg);opacity:.65}
    h1{margin:0 0 8px;font-size:clamp(34px,6vw,72px);line-height:.92;letter-spacing:-.055em;font-weight:950;max-width:800px}
    h1 span{color:var(--red)}
    .lead{color:var(--muted);max-width:650px;line-height:1.7;margin:18px 0 0}
    .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px}
    .card{border:1px solid var(--line);background:rgba(16,18,24,.88);backdrop-filter:blur(10px);padding:24px}
    .result-card{min-height:390px;display:flex;flex-direction:column;justify-content:space-between}
    .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.16em;font-weight:800;text-transform:uppercase}
    .sens-wrap{margin:32px 0 24px}
    .sens{font-variant-numeric:tabular-nums;font-size:clamp(72px,13vw,132px);font-weight:950;line-height:.85;letter-spacing:-.07em;text-shadow:0 0 35px rgba(255,70,85,.18)}
    .sens small{font-size:18px;color:var(--muted);letter-spacing:0;margin-left:12px}
    .edpi{font-size:16px;color:var(--muted);margin-top:16px}.edpi b{color:var(--text);font-size:22px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;cursor:pointer;font:inherit;font-weight:850;letter-spacing:.02em;padding:15px 20px;transition:.18s ease;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
    .primary{background:var(--red);color:white;min-width:190px;box-shadow:0 12px 32px rgba(255,70,85,.2)}
    .primary:hover{background:#ff5d69;transform:translateY(-2px)}
    .secondary{background:#222631;color:#fff}.secondary:hover{background:#2b303d}
    .controls{display:grid;gap:18px}
    .group label{display:flex;justify-content:space-between;color:#cbd0db;font-size:13px;margin-bottom:8px}.group label span{color:var(--muted)}
    input{width:100%;background:#090b10;border:1px solid #2a2e38;color:#fff;padding:14px 14px;font:inherit;outline:none}
    input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,70,85,.08)}
    .range-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .preset-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .preset{padding:11px 8px;background:#1b1e26;color:#c8cbd4;font-size:12px;clip-path:none;border:1px solid transparent}
    .preset.active{border-color:var(--red);color:white;background:rgba(255,70,85,.10)}
    .history{margin-top:18px}.history-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
    .hist{background:#0b0d12;border:1px solid var(--line);padding:11px;text-align:center;font-variant-numeric:tabular-nums;color:#d8dbe2;cursor:pointer}.hist:hover{border-color:rgba(255,70,85,.55)}
    .note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:18px}
    .flash{animation:flash .25s ease}@keyframes flash{0%{transform:scale(.985);opacity:.45}100%{transform:scale(1);opacity:1}}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#f3f5f8;color:#08090c;padding:11px 16px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:780px){.wrap{width:min(100% - 20px,1100px);padding-top:22px}.hero{padding:26px 20px}.grid{grid-template-columns:1fr}.history-list{grid-template-columns:repeat(3,1fr)}.sens{font-size:82px}.topbar .tiny{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="brand"><div class="logo"></div><div>VALO SENS RNG</div></div>
      <div class="tiny">RANDOMIZE YOUR AIM</div>
    </div>

    <section class="hero">
      <div class="eyebrow">Sensitivity Randomizer</div>
      <h1>次の感度は、<span>運</span>で決める。</h1>
      <p class="lead">指定した範囲からVALORANTのゲーム内感度をランダム生成。DPIを入れればeDPIも自動で計算します。</p>
    </section>

    <div class="grid">
      <section class="card result-card">
        <div>
          <div class="eyebrow">Generated Sensitivity</div>
          <div class="sens-wrap" id="resultBox">
            <div class="sens"><span id="sensValue">0.300</span><small>SENS</small></div>
            <div class="edpi">eDPI <b id="edpiValue">240.0</b> <span id="dpiLabel">@ 800 DPI</span></div>
          </div>
        </div>
        <div>
          <div class="actions">
            <button class="primary" id="randomBtn">RANDOMIZE</button>
            <button class="secondary" id="copyBtn">COPY</button>
          </div>
          <div class="history">
            <div class="eyebrow">Recent rolls</div>
            <div class="history-list" id="historyList"></div>
          </div>
        </div>
      </section>

      <aside class="card controls">
        <div class="eyebrow">Settings</div>
        <div class="group">
          <label>DPI <span>mouse</span></label>
          <input id="dpi" type="number" value="800" min="1" step="50" />
        </div>
        <div class="group">
          <label>感度範囲 <span>min / max</span></label>
          <div class="range-row">
            <input id="minSens" type="number" value="0.100" min="0.001" max="10" step="0.001" />
            <input id="maxSens" type="number" value="0.600" min="0.001" max="10" step="0.001" />
          </div>
        </div>
        <div class="group">
          <label>プリセット <span>range</span></label>
          <div class="preset-row">
            <button class="preset" data-min="0.100" data-max="0.250">LOW</button>
            <button class="preset active" data-min="0.200" data-max="0.500">MID</button>
            <button class="preset" data-min="0.400" data-max="0.800">HIGH</button>
          </div>
        </div>
        <div class="group">
          <label>小数点 <span>digits</span></label>
          <input id="digits" type="number" value="3" min="2" max="4" step="1" />
        </div>
        <div class="note">※ 完全な乱数で生成します。気に入った感度が出たら、数試合使ってから微調整するのがおすすめです。</div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast">コピーしました</div>

  <script>
    const $ = id => document.getElementById(id);
    const sensValue = $('sensValue');
    const edpiValue = $('edpiValue');
    const dpiLabel = $('dpiLabel');
    const resultBox = $('resultBox');
    const historyList = $('historyList');
    const history = [];

    function getSettings(){
      let min = parseFloat($('minSens').value);
      let max = parseFloat($('maxSens').value);
      const dpi = Math.max(1, parseFloat($('dpi').value) || 800);
      const digits = Math.min(4, Math.max(2, parseInt($('digits').value) || 3));
      if (!Number.isFinite(min)) min = 0.1;
      if (!Number.isFinite(max)) max = 0.6;
      if (min > max) [min, max] = [max, min];
      return {min, max, dpi, digits};
    }

    function secureRandom(){
      if (window.crypto?.getRandomValues) {
        const a = new Uint32Array(1);
        crypto.getRandomValues(a);
        return a[0] / 4294967296;
      }
      return Math.random();
    }

    function setSensitivity(value, pushHistory = true){
      const {dpi, digits} = getSettings();
      const fixed = Number(value).toFixed(digits);
      sensValue.textContent = fixed;
      edpiValue.textContent = (Number(fixed) * dpi).toFixed(1);
      dpiLabel.textContent = '@ ' + Math.round(dpi) + ' DPI';
      resultBox.classList.remove('flash');
      void resultBox.offsetWidth;
      resultBox.classList.add('flash');
      if(pushHistory){
        history.unshift(fixed);
        if(history.length > 10) history.pop();
        renderHistory();
      }
    }

    function randomize(){
      const {min, max, digits} = getSettings();
      const steps = Math.round((max - min) * Math.pow(10,digits));
      const n = Math.floor(secureRandom() * (steps + 1));
      const value = min + n / Math.pow(10,digits);
      setSensitivity(value);
    }

    function renderHistory(){
      historyList.innerHTML = '';
      history.slice(0,10).forEach(v => {
        const el = document.createElement('div');
        el.className = 'hist';
        el.textContent = v;
        el.title = 'クリックでこの感度を再表示';
        el.onclick = () => setSensitivity(Number(v), false);
        historyList.appendChild(el);
      });
    }

    function updateEdpi(){
      const {dpi} = getSettings();
      const current = parseFloat(sensValue.textContent) || 0;
      edpiValue.textContent = (current * dpi).toFixed(1);
      dpiLabel.textContent = '@ ' + Math.round(dpi) + ' DPI';
    }

    $('randomBtn').addEventListener('click', randomize);
    $('copyBtn').addEventListener('click', async () => {
      const text = sensValue.textContent;
      try{ await navigator.clipboard.writeText(text); }
      catch{ const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove(); }
      const toast = $('toast'); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1200);
    });
    $('dpi').addEventListener('input', updateEdpi);
    document.querySelectorAll('.preset').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      $('minSens').value = Number(btn.dataset.min).toFixed(3);
      $('maxSens').value = Number(btn.dataset.max).toFixed(3);
      randomize();
    }));
    document.addEventListener('keydown', e => {
      if(e.code === 'Space' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
        e.preventDefault(); randomize();
      }
    });
    randomize();
  </script>
</body>
</html>
